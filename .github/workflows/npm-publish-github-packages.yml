# Maintenance line for cypress-env 2.x (Cypress < 15.10.0).
# Runs the tests and publishes to npm under the "v2" dist-tag on every push to the 2.x branch,
# so that "latest" keeps pointing to the 3.x line released from main.
# To release a fix: commit it here, bump the 2.x version in package.json and push.

name: Node.js Package (2.x)

on:
  push:
    branches:
      - 2.x
  pull_request:
    branches:
      - 2.x

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: cd test && npm ci
      - run: cd test && npm run cy:run
  publish-npm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/2.x'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by npm trusted publishing (OIDC): no NPM_TOKEN secret is used
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm --version
      - run: npm ci
      - name: Check that the version belongs to the 2.x line and is not published yet
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            2.*) ;;
            *) echo "The 2.x branch can only publish 2.x versions (found $VERSION)"; exit 1 ;;
          esac
          if npm view "cypress-env@$VERSION" version >/dev/null 2>&1; then
            echo "cypress-env@$VERSION is already published, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: npm publish --tag v2
